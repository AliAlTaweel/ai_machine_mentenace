[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-inventory-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x removed/renamed the FastMCP class this server is built on
    # (renamed to MCPServer), so stay under 2.0 until the server is rewritten
    # against the new API.
    "mcp>=1.2.0,<2.0",
    "pymongo>=4.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mongomock>=4.1",
]

[project.scripts]
mcp-inventory-server = "mcp_server.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
