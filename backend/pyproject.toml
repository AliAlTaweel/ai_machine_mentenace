[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pymongo>=4.9",
    "sentence-transformers>=3.0",
    "mcp>=1.2.0,<2.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mongomock>=4.1",
    # Required by fastapi.testclient.TestClient, which also drives the
    # WebSocket endpoint tests in-process (no separate ws client needed).
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
